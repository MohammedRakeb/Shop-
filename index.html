<style>

.b{width:100%;font:inherit;font-weight:700;padding:12px;border:0;border-radius:12px;background:var(--g);color:var(--gt);margin:4px 0}.o{background:var(--c);color:var(--ink);border:1.5px solid var(--ln)}

header{background:var(--c);border-bottom:1px solid var(--ln)}header .p{border:0;font:inherit;color:inherit;cursor:pointer}

.t.lw{border-color:var(--y)}.t.ot{border-color:var(--r)}.bd{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;background:var(--ln);margin:1px 0}.bd.red{background:var(--r);color:#fff}.bd.yel{background:var(--y);color:#fff}

<script>
(function(){var S=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2','https://fastly.jsdelivr.net/npm/@supabase/supabase-js@2','https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'],i=0,A=function(h){document.getElementById('app').innerHTML=h};
function run(){var s=document.createElement('script');s.text=document.getElementById('main').text;document.body.appendChild(s)}
function next(){if(window.supabase&&window.supabase.createClient)return run();
 if(i>=S.length)return A('<pre style="color:#c00;direction:ltr;white-space:pre-wrap;padding:12px">Could not load the Supabase library from any source. Check the internet and reload.</pre>');
 A('<p style="padding:24px">جارٍ تحميل المكتبة… '+(i+1)+'/'+S.length+'</p>');
 var el=document.createElement('script'),d=0,t;el.src=S[i++];
 function go(){if(d)return;d=1;clearTimeout(t);next()}
 el.onload=go;el.onerror=go;t=setTimeout(go,15000);document.head.appendChild(el)}
next()})();

<script id=main type=text/plain>
const db=supabase.createClient(CFG.url,CFG.key,{auth:{lock:(n,t,f)=>f()}});document.title=CFG.name||document.title;
const $=s=>document.querySelector(s),f=n=>Math.round(n||0).toLocaleString('en-US'),esc=s=>String(s??'').replace(/[<>&"]/g,c=>'&#'+c.charCodeAt(0)+';');
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
let BR=[],br,role,tab,P=L('P',[]),ST={},cart={},q='',queue=L('q',[]),sy=0,inb=[],ch,lc='',lt=0;
const act={};
function toast(m){const t=$('#tt');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2500)}
const msg=m=>{const e=$('#msg');if(e)e.textContent=m};

/* ===== الدخول والبداية ===== */
function authV(){$('#hd').innerHTML='';$('#nv').innerHTML='';$('#app').innerHTML=`<div class=box><h1>${esc(CFG.name||'إدارة المخزن')}</h1><input id=em type=email placeholder="البريد الإلكتروني"><input id=pw type=password placeholder="كلمة المرور (6 أحرف فأكثر)"><button class=b data-a=login>دخول</button><button class="b o" data-a=signup>إنشاء حساب</button><p id=msg class=m></p></div>`}
act.login=async()=>{const r=await db.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});r.error?msg(r.error.message):boot()};
act.signup=async()=>{const r=await db.auth.signUp({email:$('#em').value.trim(),password:$('#pw').value});if(r.error)return msg(r.error.message);r.data.session?boot():msg('أُرسل رابط تأكيد إلى بريدك. افتحه ثم ادخل.')};
act.out=async()=>{await db.auth.signOut();boot()};
function setupV(){$('#hd').innerHTML='';$('#nv').innerHTML='';$('#app').innerHTML=`<div class=box><h1>البداية</h1><div class=c><b>أنا المالك: إنشاء مؤسسة</b><input id=on placeholder="اسم المؤسسة"><input id=bn placeholder="اسم الفرع الأول"><input id=bc placeholder="كود الفرع (مثل KRT)"><button class=b data-a=mkorg>إنشاء</button></div><div class=c><b>أنا موظف: رمز دعوة</b><input id=ic placeholder="الرمز"><button class="b o" data-a=redeem>انضمام</button></div><p id=msg class=m></p><button class="b o" data-a=out>خروج</button></div>`}
act.mkorg=async()=>{const r=await db.rpc('create_org',{p_org:$('#on').value,p_branch:$('#bn').value,p_code:$('#bc').value});r.error?msg(r.error.message):boot()};
act.redeem=async()=>{const r=await db.rpc('redeem_invite',{p_code:$('#ic').value});r.error?msg(r.error.message):boot()};

async function boot(){
 const{data:{session}}=await db.auth.getSession();if(!session)return authV();
 const r=await db.rpc('my_branches');BR=r.data||(r.error&&!r.error.code?L('br',[]):[]);S('br',BR);
 if(!BR.length)return setupV();
 br=BR.find(b=>b.branch_id===L('curbr',''))||BR[0];role=br.role;ST=L('ST_'+br.branch_id,{});
 const T={CASHIER:[['sell','🛒<br>بيع'],['inv','🧾<br>فواتيري']],STOREKEEPER:[['stock','📦<br>المخزن']]}[role]||[['sell','🛒<br>بيع'],['inv','🧾<br>الفواتير'],['stock','📦<br>المخزن'],['dash','📊<br>اللوحة'],['more','⚙️<br>المزيد']];
 $('#nv').innerHTML=T.map(t=>`<button data-a=go data-v=${t[0]}>${t[1]}</button>`).join('');
 act.go(T[0][0]);loadCat().then(sync);
}
function hdr(){$('#hd').innerHTML=`<b>${BR.length>1?`<select id=bs>${BR.map(b=>`<option value=${b.branch_id} ${b.branch_id==br.branch_id?'selected':''}>${esc(b.name)}</option>`).join('')}</select>`:esc(br.name)}</b>${queue.length?`<span class="p w">${queue.length} بانتظار الرفع</span>`:''}<span class="p ${navigator.onLine?'':'w'}">${navigator.onLine?'متصل':'بلا إنترنت'}</span>`;const s=$('#bs');if(s)s.onchange=e=>{S('curbr',e.target.value);boot()}}
act.go=t=>{tab=t;document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.v==t));hdr();({sell:sellV,inv:invV,stock:stockV,dash:dashW,more:moreW})[t]()};
async function loadCat(){if(!navigator.onLine)return;const a=await db.from('pos_products').select('*').eq('active',true).order('name');if(a.data){P=a.data;S('P',P)}const s=await db.rpc('branch_stock',{p_branch:br.branch_id});if(s.data){ST={};s.data.forEach(x=>ST[x.product_id]=x.qty);S('ST_'+br.branch_id,ST)}if(tab=='sell')list()}

/* ===== الكاشير (يعمل بدون إنترنت) ===== */
/* ===== الإيصال والفواتير ===== */
const fd=t=>new Date(t).toLocaleString('en-GB',{hour12:false}).slice(0,17);
let cur,rcs=[];
function rcTxt(r){return [r.br,'فاتورة '+(r.no||'مؤقتة'),fd(r.t),'------------------',...r.items.map(i=>i.n+' × '+i.q+' = '+f(i.q*i.p)),'------------------','الإجمالي: '+f(r.total),'شكراً لتعاملكم معنا'].join('\n')}
function showRc(r){cur=r;const R=$('#rc');R.hidden=false;R.innerHTML=`<div class=paper><h2>${esc(r.br)}</h2><div style="text-align:center">فاتورة ${esc(r.no||'مؤقتة (تُرقَّم عند الرفع)')}<br>${fd(r.t)}</div><hr>${r.items.map(i=>`<div class=ln><span>${esc(i.n)} × ${i.q}</span><span>${f(i.q*i.p)}</span></div>`).join('')}<div class="ln tt"><span>الإجمالي</span><span>${f(r.total)}</span></div><p style="text-align:center;margin:10px 0 0">شكراً لتعاملكم معنا</p></div><div class=np style="max-width:380px;margin:12px auto"><button class=b data-a=wa>إرسال عبر واتساب</button><button class="b o" data-a=prt>طباعة</button><button class="b o" data-a=clr>إغلاق</button></div>`}
act.wa=()=>open('https://wa.me/?text='+encodeURIComponent(rcTxt(cur)),'_blank');
act.prt=()=>print();
act.clr=()=>{$('#rc').hidden=true};
act.rc=i=>showRc(rcs[+i]);
async function invV(){
 const mgr=role=='OWNER'||role=='MANAGER',d=new Date();d.setHours(0,0,0,0);
 let H=L('rc',[]).filter(r=>new Date(r.t)>=d),src='هذا الجهاز';
 if(mgr&&navigator.onLine){
  $('#app').innerHTML='<p class=m>جارٍ التحميل…</p>';
  const r=await db.from('sales').select('id,invoice_no,total,sold_at,sale_items(product_id,qty,price)').eq('branch_id',br.branch_id).gte('sold_at',d.toISOString()).order('sold_at',{ascending:false}).limit(100);
  if(r.data){src='كل الفرع';H=r.data.map(s=>({id:s.id,no:s.invoice_no,t:s.sold_at,br:br.name,total:Number(s.total),items:s.sale_items.map(i=>{const p=P.find(x=>x.id==i.product_id);return{n:p?p.name:'سلعة',q:i.qty,p:Number(i.price)}})}))}
 }
 if(tab!='inv')return;
 rcs=H;
 const tot=H.reduce((a,r)=>a+r.total,0);
 $('#app').innerHTML=`<h2>فواتير اليوم</h2><p class=m>المصدر: ${src} · ${H.length} فاتورة · ${f(tot)}</p>`+(H.map((r,i)=>`<button class="t c" style="width:100%" data-a=rc data-v=${i}><div class=r><span class=s>${esc(r.no||'مؤقتة')}<br><span class=m>${fd(r.t)} · ${r.items.length} صنف</span></span><b>${f(r.total)}</b></div></button>`).join('')||'<p class=m>لا فواتير بعد.</p>')}
function sellV(){$('#app').innerHTML=`<div class=r><input id=q class=s placeholder="ابحث بالاسم أو الباركود" value="${esc(q)}"><button class=b style="width:auto" data-a=scan>مسح</button></div><div class=g id=ls></div><div id=ct></div>`;$('#q').oninput=e=>{q=e.target.value;list()};list();cartV()}
function list(){const a=P.filter(p=>!q||p.name.includes(q)||p.barcode==q);$('#ls').innerHTML=a.map(p=>`<button class=t data-a=add data-v=${p.id}><b>${esc(p.name)}</b><span class=k style="font-size:15px">${f(p.price)}</span><span class="m ${(ST[p.id]||0)<=p.reorder?'low':''}">متوفر ${ST[p.id]||0}</span></button>`).join('')||'<p class=m>لا سلع بعد. أضفها من «المزيد».</p>'}
function cartV(){const L2=Object.entries(cart).filter(e=>e[1]>0),tot=L2.reduce((a,[i,n])=>a+n*P.find(p=>p.id==i).price,0);$('#ct').innerHTML=`<div class=c>${L2.map(([i,n])=>{const p=P.find(x=>x.id==i);return`<div class=r><span class=s>${esc(p.name)}</span><button class=p data-a=dec data-v=${i}>−</button><b>${n}</b><button class=p data-a=add data-v=${i}>+</button><b>${f(n*p.price)}</b></div>`}).join('')||'<span class=m>الفاتورة فارغة</span>'}<div class=r><div class=s><span class=m>الإجمالي</span><div class=k>${f(tot)}</div></div><button class=b style="width:120px" data-a=pay ${L2.length?'':'disabled'}>دفع</button></div></div>`}
act.add=id=>{cart[id]=(cart[id]||0)+1;cartV()};act.dec=id=>{cart[id]--;cartV()};
act.pay=()=>{const items=Object.entries(cart).filter(e=>e[1]>0).map(([i,n])=>({product_id:i,qty:n}));if(!items.length)return;
 const tot=items.reduce((a,i)=>a+i.qty*P.find(p=>p.id==i.product_id).price,0);
 items.forEach(i=>ST[i.product_id]=(ST[i.product_id]||0)-i.qty);S('ST_'+br.branch_id,ST);
 const sale={id:crypto.randomUUID(),branch_id:br.branch_id,sold_at:new Date().toISOString(),payment:'CASH',discount:0,items};
 queue.push(sale);S('q',queue);
 const rc={id:sale.id,no:'',t:sale.sold_at,br:br.name,total:tot,items:items.map(i=>{const p=P.find(x=>x.id==i.product_id);return{n:p.name,q:i.qty,p:p.price}})};
 const H=L('rc',[]);H.unshift(rc);S('rc',H.slice(0,60));
 cart={};sellV();hdr();showRc(rc);sync()};
act.scan=async()=>{if(!window.BarcodeDetector)return toast('المتصفح لا يدعم الكاميرا. اكتب الباركود في خانة البحث');
 try{const d=new BarcodeDetector(),v=$('#cam'),s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});$('#ov').hidden=false;v.srcObject=s;await v.play();
 const t=setInterval(async()=>{const r=await d.detect(v).catch(()=>[]);const c=r[0]&&r[0].rawValue;if(!c||(c==lc&&Date.now()-lt<2500))return;lc=c;lt=Date.now();const p=P.find(x=>x.barcode==c);if(p){act.add(p.id);toast(p.name);navigator.vibrate&&navigator.vibrate(30)}else toast('باركود غير معروف: '+c)},600);
 act.stop=()=>{clearInterval(t);s.getTracks().forEach(x=>x.stop());$('#ov').hidden=true}}catch(e){toast('تعذّر فتح الكاميرا')}};
/* رفع طابور الفواتير: ok/duplicate تُحذف، خطأ شبكة يبقى للمحاولة لاحقاً، خطأ بيانات يُحفظ في bad */
async function sync(){if(sy||!queue.length||!navigator.onLine)return;sy=1;try{for(const s of [...queue]){const r=await db.rpc('record_sale',{p:s});if(r.error&&!r.error.code)break;
 if(!r.error&&r.data&&r.data.invoice_no){const H=L('rc',[]),h=H.find(x=>x.id==s.id);if(h){h.no=r.data.invoice_no;S('rc',H)}}
 queue=queue.filter(x=>x.id!=s.id);if(r.error){const bad=L('bad',[]);bad.push({s,e:r.error.message});S('bad',bad);toast('فاتورة مرفوضة: '+r.error.message)}}S('q',queue)}catch(e){}sy=0;if(br)hdr()}
addEventListener('online',()=>{if(br){hdr();sync();loadCat()}});addEventListener('offline',()=>{if(br)hdr()});setInterval(sync,20000);

/* ===== الداخل للمخزن ===== */
async function stockV(){const sp=L('sp',[]);$('#app').innerHTML=`<h2>الداخل للمخزن</h2><div class=c><select id=su><option value="">بدون مورد</option>${sp.map(s=>`<option value=${s.id}>${esc(s.name)}</option>`).join('')}</select><select id=pr>${P.map(p=>`<option value=${p.id}>${esc(p.name)}</option>`).join('')}</select><div class=r><input id=qn type=number placeholder="الكمية"><input id=co type=number placeholder="التكلفة"><input id=dy type=number placeholder="صلاحية (أيام)"></div><button class="b o" data-a=addin>إضافة للقائمة</button></div><div class=c id=in></div>`;inV();
 const r=await db.rpc('suppliers_lite');if(r.data){S('sp',r.data);if(!sp.length&&r.data.length&&tab=='stock')stockV()}}
function inV(){const tot=inb.reduce((a,x)=>a+x.qty*x.cost,0);$('#in').innerHTML=inb.map(x=>`<div class=r><span class=s>${esc(P.find(p=>p.id==x.product_id).name)} × ${x.qty}</span><b>${f(x.qty*x.cost)}</b></div>`).join('')+(inb.length?`<div class=r><span class=s>الإجمالي</span><b>${f(tot)}</b></div><input id=pd type=number placeholder="المدفوع الآن"><button class=b data-a=okin>اعتماد الوارد</button>`:'<span class=m>القائمة فارغة</span>')}
act.addin=()=>{if(!$('#pr').value)return toast('لا توجد سلع');const qty=+$('#qn').value,cost=+$('#co').value,d=+$('#dy').value;if(!(qty>0&&cost>0))return toast('أدخل الكمية والتكلفة');inb.push({product_id:$('#pr').value,qty,cost,expiry:d?new Date(Date.now()+d*864e5).toISOString().slice(0,10):''});inV()};
act.okin=async()=>{const r=await db.rpc('receive_stock',{p_branch:br.branch_id,p_party:$('#su').value||null,p_ref:null,p_paid:+$('#pd').value||0,p_items:inb});if(r.error)return toast(r.error.message);inb=[];toast('اعتُمد الوارد');loadCat();stockV()};

/* ===== لوحة المالك (لحظية) ===== */
async function dashV(){$('#app').innerHTML='<p class=m>جارٍ التحميل…</p>';

act.ppay=async id=>{const a=+prompt('مبلغ الدفعة؟');if(!(a>0))return;const r=await db.rpc('party_pay',{p_party:id,p_amount:a,p_note:null});r.error?toast(r.error.code?r.error.message:'لا يوجد اتصال'):(toast('سُجّلت الدفعة'),allyV())};
act.pacc=async id=>{const d=+prompt('احتساب حصة آخر كم يوماً؟ (1 اليوم، 7 أسبوع، 30 شهر)','7');if(!(d>0))return;const t=new Date();t.setHours(0,0,0,0);const r=await db.rpc('party_accrue',{p_party:id,p_from:new Date(t.getTime()-(d-1)*864e5).toISOString(),p_to:new Date(t.getTime()+864e5).toISOString()});r.error?toast(r.error.code?r.error.message:'لا يوجد اتصال'):(toast('الحصة: '+f(r.data)),allyV())};
act.pled=async id=>{const r=await db.from('party_ledger').select('kind,amount,created_at').eq('party_id',id).order('created_at',{ascending:false}).limit(15);const kn={INVOICE:'فاتورة شراء',PAYMENT:'دفعة',PROFIT_SHARE:'حصة أرباح'};$('#lg_'+id).innerHTML=(r.data||[]).map(x=>`<div class=r><span class=s>${kn[x.kind]} <span class=m>${fd(x.created_at)}</span></span><b>${f(x.amount)}</b></div>`).join('')||'<span class=m>لا حركات</span>'};

/* ===== النسخة 4: إضافة فروع ===== */
function branchV(){tab='branch';$('#app').innerHTML=`<button class='b o' data-a=goM>رجوع</button><h2>🏬 الفروع</h2><div class=c><b>إضافة فرع جديد</b><input id=bnn placeholder='اسم الفرع (مثل: فرع أم درمان)'><input id=bcc placeholder='كود الفرع بحروف إنجليزية (مثل OMD)' autocapitalize=characters><button class=b data-a=bad>إضافة الفرع</button></div><div class=c><b>فروعك (${BR.length})</b>${BR.map(b=>`<div class=r><span class=s>${esc(b.name)}<br><span class=m>${esc(b.code)}</span></span>${b.branch_id==br.branch_id?`<span class=p>الحالي</span>`:`<button class=chp data-a=bsw data-v=${b.branch_id}>تبديل</button>`}</div>`).join('')}</div><p class=m>الأصناف والأسعار مشتركة بين الفروع، والمخزون منفصل لكل فرع. بعد الإضافة أدخل رصيد الفرع من «المخزن» وأنشئ دعوات موظفيه من «المزيد».</p>`}
act.bad=async()=>{const n=$('#bnn').value.trim(),c=$('#bcc').value.trim();if(n.length<2||c.length<2)return toast('أدخل اسم الفرع وكوده');const r=await db.rpc('create_branch',{p_name:n,p_code:c});if(r.error)return toast(r.error.code?r.error.message:'لا يوجد اتصال');S('curbr',r.data);toast('أُضيف الفرع');boot()};
act.bsw=id=>{S('curbr',id);boot()};
act.branch=()=>branchV();

/* ===== النسخة 5: تحويلات + إدارة الأصناف + سجل المراجعة ===== */
let tl=[],PA=[],pq='';
function stockV(){$('#app').innerHTML=`<div class=chs>${[['in','📥 وارد'],['w','🗑️ توالف'],['t','🚚 تحويلات'],...(role=='STOREKEEPER'?[]:[['r','📈 تقرير صنف']])].map(([k,l])=>`<button class='chp ${sub==k?'on':''}' data-a=sub data-v=${k}>${l}</button>`).join('')}</div><div id=sb></div>`;if(sub=='r'&&role=='STOREKEEPER')sub='in';({in:inS,w:wS,t:tS,r:rS})[sub]()}
function tli(){const e=$('#tli');if(!e)return;e.innerHTML=tl.map(x=>`<div class=r><span class=s>${esc(x.n)} × ${x.qty}</span></div>`).join('')+(tl.length?`<button class=b data-a=tsend>🚚 إرسال التحويل</button>`:'')}
async function tS(){const to=BR.filter(b=>b.branch_id!=br.branch_id);if(!to.length){$('#sb').innerHTML='<div class=c><p class=m>التحويل يحتاج فرعين أو أكثر. أضف فرعاً من «المزيد ثم الفروع».</p></div>';return}
 $('#sb').innerHTML=`<div class=c><b>تحويل جديد من ${esc(br.name)}</b><select id=td>${to.map(b=>`<option value=${b.branch_id}>${esc(b.name)}</option>`).join('')}</select><input id=tp list=dl placeholder='الصنف (اسم أو باركود)' autocomplete=off>${dl()}<input id=tq type=number placeholder='الكمية'><button class='b o' data-a=tadd>إضافة للقائمة</button><div id=tli></div></div><div class=c id=tlg><p class=m>جارٍ التحميل…</p></div>`;tli();
 const r=await db.rpc('transfers_list',{p_branch:br.branch_id});if(sub!='t'||!$('#tlg'))return;const sl={IN_TRANSIT:'في الطريق',RECEIVED:'تم الاستلام',CANCELLED:'ملغى'};
 $('#tlg').innerHTML='<b>آخر التحويلات</b>'+((r.data||[]).map(x=>{const inc=x.to_id==br.branch_id,tx=(x.items||[]).map(i=>i.n+' × '+i.q).join('، ');return`<div class=r style='border-top:1px solid var(--ln);padding-top:8px'><span class=s>${inc?'⬇️ وارد من '+esc(x.from_name):'⬆️ صادر إلى '+esc(x.to_name)}<br><span class=m>${esc(tx)} · ${fd(x.created_at)}</span></span>${x.status=='IN_TRANSIT'?(inc?`<button class=chp data-a=trc data-v=${x.id}>استلام</button>`:`<button class=chp data-a=tcn data-v=${x.id}>إلغاء</button>`):`<span class=p>${sl[x.status]}</span>`}</div>`}).join('')||'<p class=m>لا تحويلات بعد.</p>')}
act.tadd=()=>{const p=fp($('#tp').value.trim()),q=+$('#tq').value;if(!p||!(q>0))return toast('اختر الصنف وأدخل الكمية');const d=$('#td').value;tl.push({product_id:p.id,qty:q,n:p.name});tS();$('#td').value=d};
act.tsend=async()=>{const r=await db.rpc('create_transfer',{p_from:br.branch_id,p_to:$('#td').value,p_items:tl.map(x=>({product_id:x.product_id,qty:x.qty}))});if(r.error)return toast(r.error.code?r.error.message:'لا يوجد اتصال بالإنترنت');tl=[];toast('أُرسل التحويل وخُصم من مخزن هذا الفرع');loadCat();tS()};
act.trc=async id=>{const r=await db.rpc('receive_transfer',{p_id:id});if(r.error)return toast(r.error.code?r.error.message:'لا يوجد اتصال بالإنترنت');toast('تم الاستلام وأُضيف للمخزن');loadCat();tS()};
act.tcn=async id=>{if(!confirm('إلغاء التحويل وإرجاع الكميات؟'))return;const r=await db.rpc('cancel_transfer',{p_id:id});if(r.error)return toast(r.error.code?r.error.message:'لا يوجد اتصال بالإنترنت');toast('أُلغي التحويل');loadCat();tS()};
async function pmV(){tab='pm';$('#app').innerHTML='<p class=m>جارٍ التحميل…</p>';const r=await db.from('products').select('id,name,barcode,category,cost,price,reorder,active').order('name');if(tab!='pm')return;PA=r.data||[];$('#app').innerHTML=`<button class='b o' data-a=goM>رجوع</button><h2>🗂️ إدارة الأصناف (${PA.length})</h2><input id=pqi placeholder='ابحث بالاسم أو الباركود' value='${esc(pq)}'><div id=pml></div>`;$('#pqi').oninput=e=>{pq=e.target.value;pml()};pml()}
function pml(){const t=pq.trim(),a=PA.filter(p=>!t||p.name.includes(t)||p.barcode.includes(t)).slice(0,60);$('#pml').innerHTML=a.map(p=>`<div class=c id=pc_${p.id}><div class=r><b class=s>${esc(p.name)}</b><span class='p ${p.active?'':'w'}'>${p.active?'نشط':'مخفي'}</span></div><span class=m>${esc(p.barcode)} · ${esc(p.category||'')}</span><div>السعر ${f(p.price)} · التكلفة ${f(p.cost)} · حد الطلب ${p.reorder}</div><button class='b o' data-a=pme data-v=${p.id}>✏️ تعديل</button></div>`).join('')||'<p class=m>لا نتائج.</p>'}
act.pm=()=>pmV();
act.pme=id=>{const p=PA.find(x=>x.id==id);$('#pc_'+id).innerHTML=`<b>${esc(p.name)}</b><input value='${esc(p.name)}'><input value='${esc(p.category||'')}' placeholder='القسم'><div class=r><input type=number value=${p.price}><input type=number value=${p.cost}><input type=number value=${p.reorder}></div><span class=m>السعر · التكلفة · حد الطلب</span><button class=b data-a=pms data-v=${id}>حفظ</button><div class=r><button class='b o' data-a=pmh data-v=${id}>${p.active?'إخفاء':'إظهار'}</button><button class='b o' data-a=pmm data-v=${id}>دمج مع صنف آخر</button></div>`};
act.pms=async id=>{const i=$('#pc_'+id).querySelectorAll('input'),v={name:i[0].value.trim(),category:i[1].value.trim()||null,price:+i[2].value,cost:+i[3].value,reorder:+i[4].value};if(!v.name||!(v.price>=0)||!(v.cost>=0))return toast('تحقق من البيانات');const r=await db.from('products').update(v).eq('id',id);if(r.error)return toast(r.error.message);toast('تم الحفظ وسُجّل في المراجعة');loadCat();pmV()};
act.pmh=async id=>{const p=PA.find(x=>x.id==id),r=await db.from('products').update({active:!p.active}).eq('id',id);if(r.error)return toast(r.error.message);toast(p.active?'أُخفي الصنف':'أُظهر الصنف');loadCat();pmV()};
act.pmm=async id=>{const p=PA.find(x=>x.id==id),k=(prompt('اكتب اسم أو باركود الصنف الأصلي الذي سيُدمج فيه «'+p.name+'»')||'').trim(),t=PA.find(x=>x.id!=id&&(x.name==k||x.barcode==k));if(!t)return toast('لم أجد الصنف');if(!confirm('نقل كل مخزون ومبيعات «'+p.name+'» إلى «'+t.name+'» وإخفاؤه؟'))return;const r=await db.rpc('merge_products',{p_from:id,p_to:t.id});if(r.error)return toast(r.error.code?r.error.message:'لا يوجد اتصال بالإنترنت');toast('تم الدمج');loadCat();pmV()};
async function audV(){tab='aud';$('#app').innerHTML='<p class=m>جارٍ التحميل…</p>';const r=await db.rpc('audit_list',{p_limit:80});if(tab!='aud')return;if(r.error)return $('#app').innerHTML=`<button class='b o' data-a=goM>رجوع</button><p class=m>${esc(r.error.code?r.error.message:'لا يوجد اتصال بالإنترنت')}</p>`;
 const an={insert:'إضافة',update:'تعديل',delete:'حذف','transfer.create':'إرسال تحويل','transfer.receive':'استلام تحويل','transfer.cancel':'إلغاء تحويل','product.merge':'دمج أصناف'},en={products:'صنف',members:'موظف',branches:'فرع',transfer:'تحويل'},fl={name:'الاسم',price:'السعر',cost:'التكلفة',active:'نشط',barcode:'الباركود',role:'الدور'};
 const dt=x=>{const d=x.detail||{};if(d.old&&d.new)return Object.keys(fl).filter(k=>k in d.new&&d.old[k]!==d.new[k]).map(k=>fl[k]+': '+d.old[k]+' ← '+d.new[k]).join('، ');if(x.action=='product.merge')return d.from+' ← '+d.to;return d.name||d.role||''};
 $('#app').innerHTML=`<button class='b o' data-a=goM>رجوع</button><h2>📜 سجل المراجعة</h2>`+(r.data.map(x=>`<div class=c><div class=r><b class=s>${an[x.action]||x.action} ${en[x.entity]||x.entity}</b><span class=m>${fd(x.created_at)}</span></div><div class=m>${esc(x.who||'')}</div><div>${esc(dt(x))}</div></div>`).join('')||'<p class=m>لا سجلات.</p>')}
act.aud=()=>audV();

document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&act[a.dataset.a])act[a.dataset.a](a.dataset.v)});
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
const fail=e=>{$('#app').innerHTML='<pre style="color:#c00;direction:ltr;white-space:pre-wrap;padding:12px">'+esc(e&&e.message||e)+'</pre>'};
addEventListener('unhandledrejection',e=>fail(e.reason));
setTimeout(()=>{if(!$('#hd').innerHTML&&!$('#app').querySelector('.box'))fail('تأخر التحميل: تحقق من الإنترنت ثم حدّث الصفحة')},10000);
(RECOV?(pwV(true),Promise.resolve()):boot()).catch(fail);
</script></body></html>
